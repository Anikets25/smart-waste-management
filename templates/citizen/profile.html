{% extends "citizen/base.html" %}
{% block title %}Profile — Citizen Portal{% endblock %}

{% block content %}
<section class="section" style="max-width:580px;">
  <div class="page-header">
    <h1>👤 My Profile</h1>
    <p class="text-muted">Update your name and phone number.</p>
  </div>

  <div class="form-card" style="margin-top:0;">
    <form method="POST" action="{{ url_for('citizen_profile') }}" novalidate>
      <div class="form-group">
        <label>Email <span class="text-muted">(cannot be changed)</span></label>
        <input type="email" class="form-control" value="{{ citizen.email or '' }}" disabled/>
      </div>
      <div class="form-group">
        <label for="name" class="required">Full Name</label>
        <input type="text" id="name" name="name" class="form-control"
               required maxlength="120" value="{{ citizen.name or '' }}"/>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" class="form-control"
               maxlength="20" value="{{ citizen.phone or '' }}" placeholder="+91 98765 43210"/>
      </div>
      <div class="form-group">
        <label>Green Points</label>
        <div class="form-control" style="background:var(--green-pale); font-weight:700; color:var(--green-dark);">
          🌿 {{ citizen.green_points or 0 }} points
        </div>
      </div>
      <button type="submit" class="btn btn-citizen btn-block">Save Changes</button>
    </form>

    <hr style="margin:1.5rem 0; border:none; border-top:1px solid var(--gray-200);"/>
    <p class="text-muted" style="font-size:.9rem; text-align:center;">
      Member since {{ citizen.created_at|format_dt }}
    </p>
  </div>
</section>
{% endblock %}
